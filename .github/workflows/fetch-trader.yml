name: Fetch trader from server

on:
  workflow_dispatch:
  push:
    branches: [claude/trader-bot-setup-SnW70]
    paths: ['.github/workflows/fetch-trader.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/trader-bot-setup-SnW70

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Discover trader project on server
        run: |
          echo "=== Searching for trader project ==="
          sshpass -p 'w6Z6Sk8DK5k#po' ssh -o StrictHostKeyChecking=no root@92.51.44.138 bash <<'REMOTE'
          echo "=== find *trad* ==="
          find /home /root /opt /var /srv -maxdepth 4 -iname '*trad*' 2>/dev/null
          echo "=== ls /home ==="
          ls -la /home/
          echo "=== ls /root ==="
          ls -la /root/
          echo "=== docker ps ==="
          docker ps -a 2>/dev/null || true
          echo "=== docker compose projects ==="
          find /home /root /opt /srv -maxdepth 3 -name 'docker-compose*' 2>/dev/null
          find /home /root /opt /srv -maxdepth 3 -name 'package.json' 2>/dev/null
          REMOTE

      - name: Fetch trader project files
        run: |
          DIRS=$(sshpass -p 'w6Z6Sk8DK5k#po' ssh -o StrictHostKeyChecking=no root@92.51.44.138 "find /home /root /opt /srv -maxdepth 3 -iname '*trad*' -type d 2>/dev/null | head -5")
          echo "Found: $DIRS"
          if [ -n "$DIRS" ]; then
            FIRST=$(echo "$DIRS" | head -1)
            echo "Fetching from: $FIRST"
            mkdir -p trader-project
            sshpass -p 'w6Z6Sk8DK5k#po' scp -o StrictHostKeyChecking=no -r "root@92.51.44.138:$FIRST/" trader-project/ || true
            find trader-project -type f | head -50
          else
            echo "No trad* dir found. Checking all /home subdirs..."
            sshpass -p 'w6Z6Sk8DK5k#po' ssh -o StrictHostKeyChecking=no root@92.51.44.138 "ls -la /home/*/" || true
          fi

      - name: Commit fetched files
        run: |
          if [ -d trader-project ] && [ "$(ls -A trader-project)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add trader-project/
            git commit -m "Add trader project fetched from server"
            git push
          else
            echo "No files fetched - check logs above"
          fi
