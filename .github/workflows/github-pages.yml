# Статический фронт (Nuxt generate) → ветка gh-pages для GitHub Pages.
# Секреты в репозитории: Settings → Secrets → Actions
#   NUXT_PUBLIC_API    — URL API с /api на конце, напр. https://ваш-домен/api
#   NUXT_PUBLIC_IMAGE  — базовый URL картинок, напр. https://ваш-домен/
# Опционально:
#   NUXT_APP_BASE_URL  — для сайта вида user.github.io/repo/ задать /repo/

name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & generate
        working-directory: web
        env:
          NUXT_PUBLIC_API: ${{ secrets.NUXT_PUBLIC_API }}
          NUXT_PUBLIC_IMAGE: ${{ secrets.NUXT_PUBLIC_IMAGE }}
          NUXT_APP_BASE_URL: ${{ secrets.NUXT_APP_BASE_URL }}
        run: |
          npm ci
          npx nuxi generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
