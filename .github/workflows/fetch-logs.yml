name: Fetch trader logs

on:
  push:
    branches: [claude/trader-bot-setup-SnW70]
    paths: ['.github/workflows/fetch-logs.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/trader-bot-setup-SnW70

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Fetch logs from server
        run: |
          sshpass -p 'w6Z6Sk8DK5k#po' ssh -o StrictHostKeyChecking=no root@92.51.44.138 bash <<'REMOTE'
          echo "=== DOCKER LOGS (last 500 lines) ==="
          # Find the trading container
          CONTAINERS=$(docker ps -a --format '{{.Names}}' 2>/dev/null)
          echo "Running containers: $CONTAINERS"
          for c in $CONTAINERS; do
            echo "--- logs $c (last 200) ---"
            docker logs --tail 200 "$c" 2>&1 || true
          done

          echo "=== FIND LOG FILES ==="
          find /home /root /opt /var/log -maxdepth 4 -name '*.log' -newer /etc/hostname 2>/dev/null | head -20

          echo "=== SYSTEMD SERVICES ==="
          systemctl list-units --type=service --state=running 2>/dev/null | grep -i trad || true

          echo "=== PROCESS LIST ==="
          ps aux | grep -i trad 2>/dev/null || true
          ps aux | grep -i python 2>/dev/null || true

          echo "=== RECENT LOG FILES CONTENT ==="
          for f in $(find /home /root /opt -maxdepth 4 -name '*.log' -mmin -120 2>/dev/null | head -5); do
            echo "--- $f (last 100 lines) ---"
            tail -100 "$f" 2>/dev/null || true
          done

          echo "=== JOURNALCTL TRADING ==="
          journalctl -u '*trad*' --no-pager -n 100 2>/dev/null || true
          REMOTE

      - name: Save logs to file
        run: |
          sshpass -p 'w6Z6Sk8DK5k#po' ssh -o StrictHostKeyChecking=no root@92.51.44.138 bash <<'REMOTE' > server-logs.txt 2>&1
          CONTAINERS=$(docker ps -a --format '{{.Names}}' 2>/dev/null)
          for c in $CONTAINERS; do
            echo "=== CONTAINER: $c ==="
            docker logs --tail 300 "$c" 2>&1 || true
          done
          for f in $(find /home /root /opt -maxdepth 4 -name '*.log' -mmin -120 2>/dev/null | head -5); do
            echo "=== FILE: $f ==="
            tail -200 "$f" 2>/dev/null || true
          done
          REMOTE

      - name: Commit logs
        run: |
          if [ -s server-logs.txt ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add server-logs.txt
            git commit -m "Add server logs for debugging"
            git push
          else
            echo "No logs captured"
          fi
