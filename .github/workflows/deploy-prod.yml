# Деплой web (и опционально api) на прод-сервер по SSH.
#
# ОДНОРАЗОВАЯ НАСТРОЙКА — Settings → Secrets and variables → Actions:
#   DEPLOY_HOST     IP/хост прод-сервера, например 92.51.44.138
#   DEPLOY_USER     SSH пользователь, например root
#   DEPLOY_SSH_KEY  приватный SSH-ключ ЦЕЛИКОМ (с -----BEGIN ... PRIVATE KEY-----)
#                   у которого публичная половина лежит в /root/.ssh/authorized_keys на сервере
#   DEPLOY_PATH     (опционально) путь на сервере. По умолчанию /home/surrogacy
#
# Запуск: автоматически при push в main; либо вручную через Actions → Run workflow.

name: Deploy to prod server

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:
    inputs:
      rebuild_api:
        description: 'Также пересобрать api контейнер'
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync project files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/surrogacy' }}
        run: |
          # Льём только web/ и api/src — без node_modules, .nuxt, .output и пр.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            --exclude='node_modules' \
            --exclude='.nuxt' \
            --exclude='.output' \
            --exclude='dist' \
            --exclude='.env' \
            web/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/web/"
          rsync -az \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            api/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/api/"

      - name: Rebuild and restart containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/surrogacy' }}
          REBUILD_API: ${{ github.event.inputs.rebuild_api || 'false' }}
        run: |
          if [ "$REBUILD_API" = "true" ]; then
            SERVICES="web api"
          else
            SERVICES="web"
          fi
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && docker compose -f docker-compose.prod.yml build $SERVICES --no-cache && docker compose -f docker-compose.prod.yml up -d $SERVICES"

      - name: Smoke check
        run: |
          sleep 5
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' https://new-origin.kz/auth || true
